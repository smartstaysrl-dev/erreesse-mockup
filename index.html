<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard REA 5.0</title>
</head>
<body>
<style>
:root{--brand:#520001;--bg:#F7F4F3;--card:#fff;--ink:#231A19;--muted:#6B5E5C;--line:#E6DDDB;--bad:#D32F2F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--brand:#E07A7B;--bg:#161212;--card:#201A1A;--ink:#EFE7E6;--muted:#B3A6A4;--line:#3A302F;--bad:#F07A7A}}
:root[data-theme="dark"]{color-scheme:dark;--brand:#E07A7B;--bg:#161212;--card:#201A1A;--ink:#EFE7E6;--muted:#B3A6A4;--line:#3A302F;--bad:#F07A7A}
body{background:var(--bg);color:var(--ink);font-family:'Raleway',system-ui,-apple-system,'Segoe UI',sans-serif}
#pg{min-height:80vh;display:flex;align-items:center;justify-content:center;padding-inline:16px}
#pg form{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:10px;padding:26px 22px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
#pg h1{margin:0;font-size:20px;font-weight:800}
#pg p{margin:0;color:var(--muted);font-size:14px}
#pg input{font:inherit;font-size:24px;letter-spacing:.3em;text-align:center;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#pg button{font:inherit;font-weight:700;font-size:16px;padding:12px;border:0;border-radius:8px;background:var(--brand);color:#fff;cursor:pointer}
#pg .err{color:var(--bad);font-size:14px;min-height:1.2em}
</style>
<div id="pg"><form id="pf" autocomplete="off">
<h1>Dashboard REA 5.0</h1>
<p>Prototipo riservato. Inserisci il PIN.</p>
<input id="pin" type="password" inputmode="numeric" maxlength="12" aria-label="PIN" autofocus>
<button type="submit" id="pb">Entra</button>
<div class="err" id="pe" role="alert"></div>
</form></div>

function u8(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function open(pin){
  var enc=new TextEncoder();
  return crypto.subtle.importKey("raw",enc.encode(pin),"PBKDF2",false,["deriveKey"]).then(function(k){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(SALT),iterations:IT,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);

function mount(html){
  var t=document.createElement("template");t.innerHTML=html;var f=t.content,codes=[];
  f.querySelectorAll("script").forEach(function(s){codes.push(s.textContent);s.remove();});
  f.querySelectorAll("link,style").forEach(function(n){if(n.parentNode===f)document.head.appendChild(n);});
  document.getElementById("pg").remove();
  document.body.appendChild(f);

}
